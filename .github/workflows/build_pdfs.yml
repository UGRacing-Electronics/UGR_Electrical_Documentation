name: Compile LaTeX Files

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-latex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Find and compile LaTeX files
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected - compiling all main.tex files"
            tex_files=$(find . -name "main.tex")
          else
            echo "Push/PR trigger detected - compiling only changed main.tex files"
            # Get changed files in the push (compare with previous commit)
            changed_files=$(git diff --name-only HEAD^1 HEAD)
            
            echo "Changed files:"
            echo "$changed_files"
            
            # Filter out changes to .github/workflows to avoid triggering on workflow updates
            changed_files=$(echo "$changed_files" | grep -v "^\.github/workflows/" || true)
            
            echo "Changed files (excluding workflow):"
            echo "$changed_files"
            
            if [ -z "$changed_files" ]; then
              echo "No relevant files changed (only workflow files updated)"
              exit 0
            fi
            
            # Find directories containing changed files
            changed_dirs=$(echo "$changed_files" | xargs -r dirname | sort -u)
            
            echo "Changed directories:"
            echo "$changed_dirs"
            
            # Find main.tex files in those directories or their parents
            tex_files=""
            for dir in $changed_dirs; do
              echo "Checking directory: $dir"
              # Check current directory and all parent directories for main.tex
              current_dir="$dir"
              while [ "$current_dir" != "." ]; do
                echo "  Looking in: $current_dir"
                if [ -f "$current_dir/main.tex" ]; then
                  echo "  Found main.tex in $current_dir"
                  tex_files="$tex_files $current_dir/main.tex"
                  break
                fi
                current_dir=$(dirname "$current_dir")
              done
              # Also check root directory
              if [ -f "./main.tex" ]; then
                echo "  Found main.tex in root"
                tex_files="$tex_files ./main.tex"
              fi
            done
            
            # Remove duplicates
            tex_files=$(echo "$tex_files" | tr ' ' '\n' | sort -u | tr '\n' ' ')
            
            echo "Final tex_files to compile: $tex_files"
            
            if [ -z "$tex_files" ]; then
              echo "No main.tex files affected by changes"
              exit 0
            fi
          fi
          
          # Compile each found main.tex file
          for tex_file in $tex_files; do
            echo "Processing: $tex_file"
            
            # Get the directory containing main.tex
            tex_dir=$(dirname "$tex_file")
            
            # Get the folder name (parent directory name)
            folder_name=$(basename "$tex_dir")
            
            # Change to the directory containing main.tex
            cd "$tex_dir"
            
            # Compile the LaTeX file with Tectonic
            tectonic main.tex
            
            # Rename the output PDF
            if [ -f "main.pdf" ]; then
              mv main.pdf "${folder_name}.pdf"
              echo "Created: ${folder_name}.pdf"
            else
              echo "Error: Failed to create PDF for $tex_file"
            fi
            
            # Return to the root directory
            cd - > /dev/null
          done
      
      - name: Commit and push PDFs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add all PDFs
          git add "**/*.pdf"
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-compile LaTeX files [skip ci]"
            git push
          fi
