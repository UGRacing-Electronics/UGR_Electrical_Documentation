name: Compile LaTeX Files

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-latex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Find and compile LaTeX files
        run: |
          # Find all main.tex files
          find . -name "main.tex" | while read -r tex_file; do
            echo "Processing: $tex_file"
            
            # Get the directory containing main.tex
            tex_dir=$(dirname "$tex_file")
            
            # Get the folder name (parent directory name)
            folder_name=$(basename "$tex_dir")
            
            # Change to the directory containing main.tex
            cd "$tex_dir"
            
            # Compile the LaTeX file with Tectonic
            tectonic main.tex
            
            # Rename the output PDF
            if [ -f "main.pdf" ]; then
              mv main.pdf "${folder_name}.pdf"
              echo "Created: ${folder_name}.pdf"
            else
              echo "Error: Failed to create PDF for $tex_file"
            fi
            
            # Return to the root directory
            cd - > /dev/null
          done
      
      - name: Commit and push PDFs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add all PDFs
          git add "**/*.pdf"
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-compile LaTeX files [skip ci]"
            git push
          fi
