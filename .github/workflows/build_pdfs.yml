name: Build PDFs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trigger-compile-workflow:
    uses: UGRacing-Electronics/UGR_Electrical_Documentation/.github/workflows/build_LaTeX.yml@main
    with:
      event_type: ${{ github.event_name }}
      repository: ${{ github.repository }}
      ref: ${{ github.ref }}
    secrets:
      CI_TOKEN: ${{ secrets.GITHUB_TOKEN }}
