name: Compile LaTeX Files (Reuseable)

on:
  workflow_call:
    inputs:
      event_type: { required: true, type: string }
      repository: { required: true, type: string }
      ref: { required: true, type: string }
    secrets:
      CI_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  compile-latex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 2
          token: ${{ secrets.CI_TOKEN }}
      
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          github-token: ${{ secrets.CI_TOKEN }}
      
      - name: Find and compile LaTeX files
        run: |
          if [ "${{ inputs.event_type }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected - compiling all main.tex files"
            find . -name "main.tex" -print0 | while IFS= read -r -d '' tex_file; do
              echo "Processing: $tex_file"
              
              # Get the directory containing main.tex
              tex_dir=$(dirname "$tex_file")
              
              # Get the folder name (parent directory name)
              folder_name=$(basename "$tex_dir")
              
              # Change to the directory containing main.tex
              cd "$tex_dir"
              
              # Compile the LaTeX file with Tectonic
              tectonic main.tex
              
              # Rename the output PDF
              if [ -f "main.pdf" ]; then
                mv main.pdf "${folder_name}.pdf"
                echo "Created: ${folder_name}.pdf"
              else
                echo "Error: Failed to create PDF for $tex_file"
              fi
              
              # Return to the root directory
              cd - > /dev/null
            done
          else
            echo "Push/PR trigger detected - compiling only changed main.tex files"
            # Get changed files in the push (compare with previous commit)
            if [ "${{ inputs.event_type }}" = "pull_request" ]; then
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
            else
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
            fi
            changed_files=$(git diff --name-only "$BASE" "$HEAD")
            
            echo "Changed files:"
            echo "$changed_files"
            
            # Filter out changes to .github/workflows to avoid triggering on workflow updates
            changed_files=$(echo "$changed_files" | grep -v "^\.github/workflows/" || true)
            
            echo "Changed files (excluding workflow):"
            echo "$changed_files"
            
            if [ -z "$changed_files" ]; then
              echo "No relevant files changed (only workflow files updated)"
              exit 0
            fi
            
            # Process each changed file
            found_tex=false
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              
              echo "Processing changed file: $file"
              
              # Get directory of changed file
              dir=$(dirname "$file")
              
              echo "Checking directory: $dir"
              
              # Check current directory and all parent directories for main.tex
              current_dir="$dir"
              while [ "$current_dir" != "." ]; do
                echo "  Looking in: $current_dir"
                if [ -f "$current_dir/main.tex" ]; then
                  echo "  Found main.tex in $current_dir"
                  found_tex=true
                  
                  # Get the folder name (parent directory name)
                  folder_name=$(basename "$current_dir")
                  
                  # Change to the directory containing main.tex
                  cd "$current_dir"
                  
                  # Compile the LaTeX file with Tectonic
                  echo "Compiling $current_dir/main.tex"
                  tectonic main.tex
                  
                  # Rename the output PDF
                  if [ -f "main.pdf" ]; then
                    mv main.pdf "${folder_name}.pdf"
                    echo "Created: ${folder_name}.pdf"
                  else
                    echo "Error: Failed to create PDF for $current_dir/main.tex"
                  fi
                  
                  # Return to the root directory
                  cd - > /dev/null
                  break
                fi
                current_dir=$(dirname "$current_dir")
              done
              
              # Also check root directory
              if [ "$dir" != "." ] && [ -f "./main.tex" ]; then
                echo "  Found main.tex in root"
                found_tex=true
                tectonic main.tex
                if [ -f "main.pdf" ]; then
                  root_name=$(basename "$PWD")
                  mv main.pdf "${root_name}.pdf"
                  echo "Created: ${root_name}.pdf"
                fi
              fi
            done <<< "$changed_files"
            
            if [ "$found_tex" = false ]; then
              echo "No main.tex files affected by changes"
              exit 0
            fi
          fi
      
      - name: Commit and push PDFs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          find . -name "*.pdf" -print0 | xargs -0 git add
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-compile LaTeX files [skip ci]"
            git push
          fi
